<!DOCTYPE html>
<html>
<head>
    <title>Contact Manager - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/code.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Left Side (Signup appears here) -->
        <div class="left-side" id="leftSide">
            <div class="signup-content" id="signupContent">
                <h2>Create Account</h2>
                <form id="signupForm" onsubmit="event.preventDefault(); doSignup();">
                    <div class="input-group">
                        <input type="text" id="firstName" required>
                        <label>First Name</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="lastName" required>
                        <label>Last Name</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="login" required>
                        <label>Username</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" required pattern ="^(?=.*[!@#$%^&*])(?=.{6,})">
                        <label>Password</label>
                        <div class="password-requirements">
                        <small>Min 6 characters, at least one special character (!@#$%^&*...)</small>
                    </div>
                    <div class="input-group" style="position: relative; top: 20px;">
                        <input type="password" id="confirmPassword" required>
                        <label>Confirm Password</label>
                    </div>
                    </div>
                    <button type="submit" class="submit-btn">Sign Up</button>
                    <span id="signupResult" class="result-message"> </span>
                    <p class="toggle-text">Already have an account? <a href="#" onclick="showLogin(); return false;">Login</a></p>
                </form>
            </div>
        </div>

        <!-- Right Side (Login appears here) -->
        <div class="right-side" id="rightSide">
            <div class="login-content" id="loginContent">
                <h1>Welcome Back</h1>
                <p class="subtitle">Contact Manager</p>
                <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
                    <div class="input-group">
                        <input type="text" id="loginName" required>
                        <label>Username</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="loginPassword" required>
                        <label>Password</label>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                    <span id="loginResult" class="result-message"></span>
                    <p class="toggle-text">Don't have an account? <a href="#" onclick="showSignup(); return false;">Sign Up</a></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('signup') === 'true') {
                showSignup();
            }
        });

        function showSignup() {
            document.getElementById('loginContent').style.display = 'none';
            document.getElementById('signupContent').style.display = 'block';
            document.getElementById('rightSide').classList.add('empty');
            document.getElementById('leftSide').classList.add('active');
        }

        function showLogin() {
            document.getElementById('signupContent').style.display = 'none';
            document.getElementById('loginContent').style.display = 'block';
            document.getElementById('rightSide').classList.remove('empty');
            document.getElementById('leftSide').classList.remove('active');
        }

    </script>
</body>
</html>
